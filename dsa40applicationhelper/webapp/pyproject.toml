[project]
name = "webapp"
version = "0.1.0"
description = "DSA40 Application Helper — Web Application"
readme = "README.md"
authors = [
  { name = "Luis Glaser", email = "l.glaser@comprensio.ai" },
  { name = "Nico Pfiffner", email = "nico@pfiffner-researchit.com" },
]
requires-python = ">=3.14"
dependencies = ["django>=6.1.1"]

[dependency-groups]
dev = ["pre-commit>=4.6.2", "ruff>=0.16.8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

# ==== Coverage ====
[tool.coverage.run]
include = ["dsa40/**"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
fail_under = 80

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

# ==== Ruff ====
[tool.ruff]
target-version = "py314"

extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "N", "UP", "YTT", "ANN", "ASYNC", "S", "BLE",
    "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC",
    "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF",
    "SLOT", "SIM", "TID", "TC", "INT", "PTH", "ERA", "PD", "PGH", "PL", "TRY",
    "FLY", "PERF", "RUF",
]
ignore = [
    "S101",    # Use of assert detected
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102",  # sometimes it's better to nest
    "FBT001",
    "COM812",
    "ANN002",  # Annotation of function *args arguments
    "ANN003",  # Annotation of function *kwargs arguments
]
# Fixes in extend-unsafe-fixes require the `--unsafe-fixes` flag when fixing.
extend-unsafe-fixes = [
    "UP038",
]

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"test*.py" = ["SLF001", "PLR2004", "FBT003", "PT009", "S106", "PT027", "S105", "ANN"]
